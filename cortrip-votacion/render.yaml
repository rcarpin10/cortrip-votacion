# Plano para Render: crea la base de datos y el servicio con un solo clic
databases:
  - name: cortrip-db
    plan: free
services:
  - type: web
    name: cortrip-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: cortrip-db, property: connectionString }
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WHATSAPP_MODO
        value: consola
      - key: ORIGEN_PERMITIDO
        value: "*"
