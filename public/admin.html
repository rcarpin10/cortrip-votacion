<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORTRIP · Administración</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f3f6f9;color:#1c2833}
h1{font:700 1.4rem Georgia,serif;color:#14304f}section{background:#fff;border:1px solid #cfd8e1;border-radius:10px;padding:16px;margin:14px 0}
h2{font-size:1.05rem;margin:0 0 8px}input,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid #cfd8e1;border-radius:8px;margin:4px 0}
button{font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:8px;background:#14304f;color:#fff;margin-top:6px}
pre{background:#eef2f6;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:.85rem}</style></head><body>
<h1>Administración CORTRIP</h1>
<section><h2>0. Clave de administrador</h2>
<input id="url" type="hidden"><input id="tok" type="password" placeholder="Clave de administrador (ADMIN_TOKEN)"></section>
<section><h2>1. Cargar socios</h2><p>Una línea por socio: cédula,nombre,categoria,correo,whatsapp</p>
<textarea id="soc" rows="5">0000000001,Amigo Uno,activo,uno@correo.com,+593900000001
0000000002,Amigo Dos,activo,dos@correo.com,+593900000002</textarea><button onclick="cargar()">Cargar socios</button></section>
<section><h2>2. Crear elección</h2><input id="nom" value="Elección de prueba"><input id="lis" value="Lista A, Lista B">
<button onclick="crear()">Crear elección</button></section>
<section><h2>3. Abrir votación (congela padrón y genera clave)</h2><input id="eid" placeholder="Número de elección" value="1">
<button onclick="abrir()">Abrir votación</button></section>
<section><h2>4. Cierre y conteo</h2><textarea id="par" rows="3" placeholder="Pegue 3 partes de la clave, una por línea"></textarea>
<button onclick="contar()">Contar votos</button></section>
<pre id="out">Resultado aparecerá aquí.</pre>
<script>
const $=i=>document.getElementById(i);$("url").value=location.origin;
async function p(r,d){try{const x=await fetch($("url").value.replace(/\/$/,"")+r,{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":$("tok").value},body:JSON.stringify(d||{})});
$("out").textContent=JSON.stringify(await x.json(),null,2)}catch(e){$("out").textContent="Error: "+e.message}}
const cargar=()=>p("/admin/socios",{socios:$("soc").value.trim().split("\n").map(l=>{const[c,n,k,m,w]=l.split(",").map(x=>x.trim());return{cedula:c,nombre:n,categoria:k,correo:m,whatsapp:w}})});
const crear=()=>p("/admin/elecciones",{nombre:$("nom").value,listas:$("lis").value.split(",").map(x=>x.trim()).filter(Boolean)});
const abrir=()=>p(`/admin/elecciones/${$("eid").value}/abrir`);
const contar=()=>p(`/admin/elecciones/${$("eid").value}/escrutinio`,{partes:$("par").value.trim().split("\n").map(x=>x.trim()).filter(Boolean)});
</script></body></html>
